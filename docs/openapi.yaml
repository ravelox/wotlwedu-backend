  /v1/register/:
    post:
      summary: Register a consumer account with a personal organization and first space
      parameters: []
      responses:
        '200':
          description: Registration accepted and confirmation email queued
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - firstName
              - password
              properties:
                email:
                  type: string
                  format: email
                firstName:
                  type: string
                lastName:
                  type: string
                password:
                  type: string
                  minLength: 8
                spaceName:
                  type: string
                  description: Optional display name for the first personal space.
                organizationName:
                  type: string
                  description: Optional display name for the personal organization.
      description: |
        Self-service consumer registration creates a private organization, creates
        the first personal space, makes the new user the admin for that space, and
        starts the poll tutorial. The account remains inactive until the email
        confirmation token is used.
