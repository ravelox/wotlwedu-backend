      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idToken
              properties:
                idToken:
                  type: string
                inviteToken:
                  type: string
      description: |
        Returns normal auth tokens for a linked or newly provisioned account.
        When the verified Google identity matches an existing password-based account,
        this returns `linkRequired: true` plus a short-lived `linkToken` instead of auth tokens.
