services:
  wotlwedudb:
    env_file: "/secrets/mariadb/secrets.env"
    image: mariadb
    ports:
      - 3306:3306
    volumes:
      - wotlwedu-database:/var/lib/mysql
  wotlwedu-backend:
    depends_on:
      - wotlwedudb
    environment:
      - WOTLWEDU_DB_HOST=wotlwedudb
      - WOTLWEDU_DB_USER=wotlwedu
      - WOTLWEDU_DB_PASSWORD=wotlwedu
      - WOTLWEDU_APP_PORT=9876
      - WOTLWEDU_SSL=false
      - WOTLWEDU_API_URL=http://localhost:9876/
      - WOTLWEDU_FRONTEND_URL=http://localhost:5173
      - WOTLWEDU_CORS_ORIGINS=http://localhost:4200,http://localhost:5173,http://localhost:4173,http://localhost:9876
    env_file: "/secrets/wotlwedu-backend/secrets.env"
    image: ravelox/wotlwedu-backend
    ports:
      - 9876:9876
    volumes:
        - /secrets/wotlwedu-backend:/secrets
        - wotlwedu-images:/var/opt/wotlwedu-backend/public/images
volumes:
  wotlwedu-database:
    driver: local
  wotlwedu-images:
    driver: local
