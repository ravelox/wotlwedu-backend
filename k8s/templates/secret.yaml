{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "wotlwedu-backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: "{{ .Values.secrets.dbPassword }}"
  db-root-password: "{{ .Values.secrets.dbRootPassword }}"
  jwt-secret: "{{ .Values.secrets.jwtSecret }}"
{{- end }}
