apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wotlwedu-backend.fullname" . }}
  labels:
    {{- include "wotlwedu-backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "wotlwedu-backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wotlwedu-backend.selectorLabels" . | nindent 8 }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ default (include "wotlwedu-backend.fullname" .) .Values.serviceAccount.name }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "wotlwedu-backend.name" . }}
          image: "{{ .Values.image.repository }}{{- if .Values.image.tag }}:{{ .Values.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.env.appPort }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: WOTLWEDU_APP_PORT
              value: "{{ .Values.env.appPort }}"
            - name: WOTLWEDU_APP_LISTEN
              value: "{{ .Values.env.appListen }}"
            - name: WOTLWEDU_SSL
              value: "{{ ternary "true" "false" .Values.env.sslEnabled }}"
            - name: WOTLWEDU_API_URL
              value: "{{ .Values.env.apiUrl }}"
            - name: WOTLWEDU_FRONTEND_URL
              value: "{{ .Values.env.frontendUrl }}"
            - name: WOTLWEDU_CORS_ORIGINS
              value: "{{ .Values.env.corsOrigins }}"
            - name: WOTLWEDU_CORS_ALLOW_NO_ORIGIN
              value: "{{ ternary "true" "false" .Values.env.corsAllowNoOrigin }}"
            - name: WOTLWEDU_CORS_CREDENTIALS
              value: "{{ ternary "true" "false" .Values.env.corsCredentials }}"
            - name: WOTLWEDU_JWT_REFRESH_COOKIE_ENABLED
              value: "{{ ternary "true" "false" .Values.env.refreshCookieEnabled }}"
            - name: WOTLWEDU_JWT_REFRESH_COOKIE_SAMESITE
              value: "{{ .Values.env.refreshCookieSameSite }}"
            - name: WOTLWEDU_JWT_REFRESH_COOKIE_SECURE
              value: "{{ ternary "true" "false" .Values.env.refreshCookieSecure }}"
            - name: WOTLWEDU_TRUST_PROXY
              value: "{{ .Values.env.trustProxy }}"
            - name: WOTLWEDU_JSON_BODY_LIMIT
              value: "{{ .Values.env.jsonBodyLimit }}"
            - name: WOTLWEDU_URLENCODED_BODY_LIMIT
              value: "{{ .Values.env.urlEncodedBodyLimit }}"
            - name: WOTLWEDU_UPLOAD_MAX_BYTES
              value: "{{ .Values.env.uploadMaxBytes }}"
            - name: WOTLWEDU_MEDIA_STORAGE_PROVIDER
              value: "{{ .Values.media.provider }}"
            - name: WOTLWEDU_MEDIA_PUBLIC_BASE_URL
              value: "{{ .Values.media.publicBaseUrl }}"
            - name: WOTLWEDU_MEDIA_KEY_PREFIX
              value: "{{ .Values.media.keyPrefix }}"
            - name: WOTLWEDU_S3_ENDPOINT
              value: "{{ .Values.media.s3.endpoint }}"
            - name: WOTLWEDU_S3_REGION
              value: "{{ .Values.media.s3.region }}"
            - name: WOTLWEDU_S3_BUCKET
              value: "{{ .Values.media.s3.bucket }}"
            - name: WOTLWEDU_S3_FORCE_PATH_STYLE
              value: "{{ ternary "true" "false" .Values.media.s3.forcePathStyle }}"
            - name: WOTLWEDU_S3_TLS
              value: "{{ ternary "true" "false" .Values.media.s3.tls }}"
            - name: WOTLWEDU_RATE_LIMIT_STORE
              value: "{{ .Values.env.rateLimitStore }}"
            - name: WOTLWEDU_RATE_LIMIT_FAIL_OPEN
              value: "{{ ternary "true" "false" .Values.env.rateLimitFailOpen }}"
            - name: WOTLWEDU_METRICS_ENABLED
              value: "{{ ternary "true" "false" .Values.env.metricsEnabled }}"
            - name: WOTLWEDU_ERROR_REPORTING_WEBHOOK_URL
              value: "{{ .Values.env.errorReportingWebhookUrl }}"
            - name: WOTLWEDU_ERROR_REPORTING_TIMEOUT_MS
              value: "{{ .Values.env.errorReportingTimeoutMs }}"
            - name: WOTLWEDU_ERROR_REPORTING_INCLUDE_STACK
              value: "{{ ternary "true" "false" .Values.env.errorReportingIncludeStack }}"
            - name: WOTLWEDU_DB_HOST
              value: "{{ .Values.database.host }}"
            - name: WOTLWEDU_DB_NAME
              value: "{{ .Values.database.name }}"
            - name: WOTLWEDU_DB_USER
              value: "{{ .Values.database.user }}"
            - name: WOTLWEDU_DB_ROOT_USER
              value: "{{ .Values.database.rootUser }}"
            - name: WOTLWEDU_DB_LOGGING
              value: "{{ ternary "true" "false" .Values.env.dbLogging }}"
            - name: WOTLWEDU_DB_SYNC
              value: "{{ ternary "true" "false" .Values.env.dbSync }}"
            - name: WOTLWEDU_DB_WAIT_TIMEOUT_SECONDS
              value: "{{ .Values.env.dbWaitTimeoutSeconds }}"
            - name: WOTLWEDU_HOUSEKEEPING_INTERVAL
              value: "{{ .Values.env.housekeepingInterval }}"
            - name: WOTLWEDU_IMAGE_DIR
              value: "{{ .Values.persistence.mountPath }}"
            - name: WOTLWEDU_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: db-password
            - name: WOTLWEDU_DB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: db-root-password
            - name: WOTLWEDU_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: jwt-secret
            - name: WOTLWEDU_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: s3-access-key-id
                  optional: true
            - name: WOTLWEDU_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: s3-secret-access-key
                  optional: true
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: image-store
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: image-store
          {{- if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "wotlwedu-backend.fullname" . }}-images
          {{- end }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
