replicaCount: 1
environment: ""

image:
  repository: wotlwedu-backend
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 9876

ingress:
  enabled: false
  className: ""
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: api.wotlwedu.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: wotlwedu-backend-tls
      hosts:
        - api.wotlwedu.com

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL

resources: {}

probes:
  startup:
    path: /healthz
    initialDelaySeconds: 2
    periodSeconds: 2
    timeoutSeconds: 3
    failureThreshold: 30
  readiness:
    path: /readyz
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 6
  liveness:
    path: /healthz
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

nodeSelector: {}

tolerations: []

affinity: {}

env:
  appPort: 9876
  appListen: 0.0.0.0
  sslEnabled: false
  apiUrl: "http://localhost:9876/"
  frontendUrl: "http://localhost:5173"
  corsOrigins: "http://localhost:4200,http://localhost:5173,http://localhost:4173,http://localhost:9876"
  corsAllowNoOrigin: false
  corsCredentials: false
  refreshCookieEnabled: false
  refreshCookieSameSite: lax
  refreshCookieSecure: true
  trustProxy: true
  jsonBodyLimit: 1mb
  urlEncodedBodyLimit: 1mb
  uploadMaxBytes: 5242880
  rateLimitStore: database
  rateLimitFailOpen: false
  metricsEnabled: true
  errorReportingWebhookUrl: ""
  errorReportingTimeoutMs: 2000
  errorReportingIncludeStack: false
  housekeepingInterval: 300
  dbLogging: false
  dbSync: true
  dbWaitTimeoutSeconds: 30

database:
  host: wotlwedu-db
  name: wotlwedu
  user: wotlwedu
  rootUser: root

secrets:
  create: true
  name: wotlwedu-backend-secrets
  dbPassword: change-me
  dbRootPassword: change-root
  jwtSecret: change-jwt
  s3AccessKeyId: ""
  s3SecretAccessKey: ""

media:
  provider: local
  publicBaseUrl: "http://localhost:9876/images/"
  keyPrefix: pictures
  s3:
    endpoint: ""
    region: us-east-1
    bucket: ""
    forcePathStyle: false
    tls: true

persistence:
  enabled: false
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  storageClass: ""
  mountPath: /var/opt/wotlwedu-backend/public/images

serviceAccount:
  create: false
  annotations: {}
  name: ""

environments: {}
